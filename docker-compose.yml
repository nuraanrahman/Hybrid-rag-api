services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nuraan
      POSTGRES_PASSWORD: Wrongpassword1
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://nuraan:Wrongpassword1@db:5432/ragdb

volumes:
  pgdata:
